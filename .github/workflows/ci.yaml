name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint
        run: golangci-lint run --timeout=5m

      - name: Test
        run: go test -race -coverprofile=cover.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=cover.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  migration-idempotency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: job_discovery
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          curl -sSfL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar -xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run migrations (first pass)
        run: migrate -path ./migrations -database "postgres://postgres:test@localhost:5432/job_discovery?sslmode=disable" up

      - name: Run migrations again (idempotency check)
        run: migrate -path ./migrations -database "postgres://postgres:test@localhost:5432/job_discovery?sslmode=disable" up

      - name: Verify schema is correct
        run: |
          PGPASSWORD=test psql -h localhost -U postgres -d job_discovery -c "\dt"
