name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  release-please:
    # Only meaningful on branch pushes; no-op on tag pushes.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go

      # Auto-merge the release-please PR using a PAT when one is configured.
      #
      # The default GITHUB_TOKEN is intentionally restricted: pushes/merges
      # performed with it do NOT trigger downstream workflows (GitHub's
      # loop-prevention rule). That breaks release-please's tag-on-merge
      # flow — the chore(release) commit lands on main but no Release run
      # fires, so the tag is never created and no image is built.
      #
      # The PAT (repo secret `RELEASE_PLEASE_PAT`, scope: `repo`) bypasses
      # that rule: the merge push it produces triggers the next Release
      # run, which (a) sees the just-merged release PR and creates the
      # vX.Y.Z tag, and (b) the tag push triggers the build-push job.
      #
      # If the PAT is unset the step falls back to GITHUB_TOKEN — the
      # workflow still functions, but the resulting release PR will sit
      # awaiting a human merge (which then triggers the next run as
      # normal).
      # NB: `env:` is evaluated before `if:`, so `fromJson(steps.release.outputs.pr).number`
      # is parsed on every run even when no release PR was opened (e.g. Flux
      # ImageUpdateAutomation commits, docs-only pushes). The conditional in the
      # expression below short-circuits to '' in that case, avoiding the
      # "Error reading JToken" failure that would otherwise turn every non-release
      # push into a red CI run.
      - name: Auto-merge release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.release.outputs.pr != '' && fromJson(steps.release.outputs.pr).number || '' }}
        run: gh pr merge --auto --merge "$PR_NUMBER" --repo "${{ github.repository }}"

  build-push:
    needs: [release-please]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thadamski/job-discovery:${{ steps.tag.outputs.value }}
            ghcr.io/thadamski/job-discovery:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/thadamski/job-discovery:${{ steps.tag.outputs.value }}
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/thadamski/job-discovery@${{ steps.build.outputs.digest }}

      - name: Make package public
        run: |
          curl -sS --fail-with-body \
            -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GHCR_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/job-discovery \
            -d '{"visibility":"public"}' || echo "package visibility update skipped (GHCR_PAT not set)"
