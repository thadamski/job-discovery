version: "2"
sql:
  - engine: postgresql
    queries: internal/store/queries
    schema: migrations
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        # No sqlc/pgtype types in app code. Every nullable column maps to a
        # Go-native pointer; UUIDs use google/uuid; timestamps use time.Time;
        # jsonb is raw []byte (decoded in the domain layer).
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type:   "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import:  "github.com/google/uuid"
              type:    "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type:   "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import:  "time"
              type:    "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type:    "string"
              pointer: true
          - db_type: "bool"
            nullable: true
            go_type:
              type:    "bool"
              pointer: true
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type:
              type:    "bool"
              pointer: true
          - db_type: "pg_catalog.int2"
            go_type:  "int16"
          - db_type: "pg_catalog.int2"
            nullable: true
            go_type:
              type:    "int16"
              pointer: true
          - db_type: "jsonb"
            go_type:
              type:  "byte"
              slice: true
          - db_type: "text[]"
            go_type:
              type:  "string"
              slice: true
