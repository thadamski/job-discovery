apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-discovery
  namespace: job-hunt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-discovery
  template:
    metadata:
      labels:
        app: job-discovery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: migrate/migrate:4
          args:
            - -path=/migrations
            - -database=$(POSTGRES_DSN)
            - up
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: job-discovery-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: job-discovery
          image: ghcr.io/thadamski/job-discovery:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: job-discovery-db-app
                  key: uri
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: migrations
          configMap:
            name: job-discovery-migrations
