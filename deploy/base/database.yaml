apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: job-discovery-db
  namespace: job-hunt
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: job_discovery
      owner: app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
